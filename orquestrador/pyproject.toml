[project]
name = "orquestrador"
version = "0.1.0"
description = "WhatsApp stock assistant orchestrator"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.151.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "redis==8.1.0",
    "uvicorn==0.54.0",
    "google-genai==2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
